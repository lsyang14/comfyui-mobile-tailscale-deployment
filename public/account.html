<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心</title><style>:root{color-scheme:dark}body{font:16px system-ui;max-width:600px;margin:auto;padding:1.2rem;background:#1b1d21;color:#f3f4f6}.glass,button{display:flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none;color:#f7f9ff;background:#ffffff18;border:1px solid #ffffff38;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px #ffffff25,0 8px 24px #0003;border-radius:12px;padding:.75rem;margin:1rem 0}button{font:inherit;width:100%;cursor:pointer}</style><h1>个人中心</h1><div id="info">加载中…</div><a class="glass" href="/">← 返回生成页</a><a class="glass" href="/gallery">打开我的图库</a><button id="logout">退出登录</button><script>fetch('/api/auth/me').then(async r=>{if(!r.ok){document.getElementById('info').textContent='请先在生成页登录';return}const u=await r.json();document.getElementById('info').textContent=`账户：${u.username}（${u.role==='admin'?'管理员':'普通用户'}）`});document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'}</script></html>
