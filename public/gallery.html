<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的图库</title><style>:root{color-scheme:dark}body{font:16px system-ui;max-width:800px;margin:auto;padding:1rem;background:#1b1d21;color:#f3f4f6}.glass,button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#f7f9ff;background:#ffffff18;border:1px solid #ffffff38;backdrop-filter:blur(16px);border-radius:12px;padding:.65rem .9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem}.grid img{box-sizing:border-box;width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #ffffff38;padding:3px;background:#ffffff12;border-radius:14px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#08101ee8;padding:1rem;overflow:auto}.modal img{box-sizing:border-box;display:block;max-width:100%;max-height:70vh;margin:1rem auto;border:1px solid #ffffff38;padding:4px;background:#ffffff12;border-radius:16px}.card{max-width:700px;margin:2rem auto;background:#191b20cc;border:1px solid #ffffff38;padding:1rem;border-radius:16px}</style><h1>我的图库</h1><p><a class="glass" href="/">← 返回生成页</a> <a class="glass" href="/account">个人中心</a></p><div id="gallery" class="grid"></div><div id="modal" class="modal"><div class="card"><button id="closeBtn" type="button">← 返回图库</button><img id="big" alt="生成图片"><p id="details"></p></div></div><script>const $=id=>document.getElementById(id);let visible=[];function proxy(x){return '/api/images/'+encodeURIComponent(x.job_id)}function closeModal(){$('modal').style.display='none'}function openItem(i){const x=visible[i];$('big').src=proxy(x);$('details').textContent=`提示词：${x.prompt}｜画面比例：${x.aspect_ratio}｜图像像素量：${x.megapixels} MP｜种子：${x.seed}`;$('modal').style.display='block'}$('closeBtn').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});async function load(){const r=await fetch('/api/gallery');if(!r.ok){$('gallery').textContent='请先在生成页登录';return}visible=(await r.json()).items.filter(x=>x.image_url);const root=$('gallery');while(root.firstChild)root.removeChild(root.firstChild);if(!visible.length){root.textContent='暂无图片';return}visible.forEach((x,i)=>{const img=document.createElement('img');img.alt=x.prompt||'生成图片';img.src=proxy(x);img.addEventListener('click',()=>openItem(i));img.addEventListener('error',()=>{img.alt='图片暂时不可用'});root.append(img)})}load()</script></html>
