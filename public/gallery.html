<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的图库</title><style>:root{color-scheme:dark}body{font:16px system-ui;max-width:800px;margin:auto;padding:1rem;background:#101114;color:#f3f4f6}a,button{color:#9fc0ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000d;padding:1rem;overflow:auto}.modal img{display:block;max-width:100%;max-height:70vh;margin:auto;border-radius:10px}.card{max-width:700px;margin:2rem auto;background:#191b20;padding:1rem;border-radius:12px}.close{font-size:1rem;padding:.65rem 1rem;border-radius:8px;background:#326bff;color:#fff;border:0;cursor:pointer}</style><h1>我的图库</h1><p><a href="/">← 返回生成页</a>　<a href="/account">个人中心</a></p><div id="gallery" class="grid"></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><button class="close" onclick="closeModal()">← 返回图库</button><img id="big"><p id="details"></p></div></div><script>const $=id=>document.getElementById(id);let items=[];function closeModal(){$('modal').style.display='none'}window.closeModal=closeModal;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});async function load(){const r=await fetch('/api/gallery');if(!r.ok){$('gallery').textContent='请先在生成页登录';return}items=(await r.json()).items;const visible=items.filter(x=>x.image_url);$('gallery').innerHTML=visible.map((x,i)=>`<img src="${x.image_url}" onclick="openItem(${i})">`).join('')||'暂无图片';window.openItem=i=>{const x=visible[i];$('big').src=x.image_url;$('details').textContent=`提示词：${x.prompt}｜画面比例：${x.aspect_ratio}｜图像像素量：${x.megapixels} MP｜种子：${x.seed}`;$('modal').style.display='block'}}load()</script></html>
