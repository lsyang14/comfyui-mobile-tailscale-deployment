<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的图库</title><style>:root{color-scheme:dark}body{font:16px system-ui;max-width:800px;margin:auto;padding:1rem;background:radial-gradient(circle at top,#1c3158,#101114 48%);color:#f3f4f6}.glass,button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#f7f9ff;background:#ffffff18;border:1px solid #ffffff38;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px #ffffff25,0 8px 24px #0003;border-radius:12px;padding:.65rem .9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem}.grid img{box-sizing:border-box;width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #ffffff38;padding:3px;background:#ffffff12;backdrop-filter:blur(12px);box-shadow:inset 0 1px #ffffff25,0 8px 24px #0005;border-radius:14px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#08101ee8;padding:1rem;overflow:auto}.modal img{box-sizing:border-box;display:block;max-width:100%;max-height:70vh;margin:1rem auto;border:1px solid #ffffff38;padding:4px;background:#ffffff12;backdrop-filter:blur(12px);box-shadow:inset 0 1px #ffffff25,0 12px 36px #0008;border-radius:16px}.card{max-width:700px;margin:2rem auto;background:#191b20cc;border:1px solid #ffffff38;backdrop-filter:blur(18px);padding:1rem;border-radius:16px}.close{cursor:pointer}</style><h1>我的图库</h1><p><a class="glass" href="/">← 返回生成页</a> <a class="glass" href="/account">个人中心</a></p><div id="gallery" class="grid"></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><button class="close" onclick="closeModal()">← 返回图库</button><img id="big"><p id="details"></p></div></div><script>const $=id=>document.getElementById(id);function closeModal(){$('modal').style.display='none'}window.closeModal=closeModal;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});async function load(){const r=await fetch('/api/gallery');if(!r.ok){$('gallery').textContent='请先在生成页登录';return}const visible=(await r.json()).items.filter(x=>x.image_url);$('gallery').innerHTML=visible.map((x,i)=>`<img src="${x.image_url}" onclick="openItem(${i})">`).join('')||'暂无图片';window.openItem=i=>{const x=visible[i];$('big').src=x.image_url;$('details').textContent=`提示词：${x.prompt}｜画面比例：${x.aspect_ratio}｜图像像素量：${x.megapixels} MP｜种子：${x.seed}`;$('modal').style.display='block'}}load()</script></html>
