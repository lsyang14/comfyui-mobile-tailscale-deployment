<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComfyUI Mobile</title>
<style>
:root{color-scheme:dark}body{font:16px system-ui;max-width:680px;margin:0 auto;padding:1.25rem;background:#101114;color:#f3f4f6}h1{font-size:2rem;margin:.5rem 0 1.5rem}textarea,input,button{font:inherit;width:100%;box-sizing:border-box;margin:.5rem 0;padding:.75rem;border-radius:10px;border:1px solid #4b5563;background:#202226;color:#f3f4f6}textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}button{background:#326bff;border:0;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.progress-card{display:none;margin-top:1rem;padding:1rem;border:1px solid #374151;border-radius:12px;background:#191b20}.progress-label{display:flex;justify-content:space-between;margin-bottom:.5rem}.bar{height:12px;background:#30343d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4f8cff;transition:width .25s}.result{display:none;margin-top:1.25rem}.result img{max-width:100%;display:block;border-radius:12px;box-shadow:0 8px 30px #0008}.result a{display:inline-block;margin-top:.75rem;color:#8ab4ff}.error{display:none;color:#ff9f9f;margin-top:1rem}
</style>
<h1>ComfyUI Mobile</h1>
<textarea id="prompt" rows="6" placeholder="输入提示词"></textarea>
<div class="row"><input id="ratio" value="3:4 (Portrait Standard)"><input id="seed" type="number" value="-1"></div>
<label><input id="upscale" type="checkbox"> 高清修复</label>
<button id="go">生成图片</button>
<section id="progress" class="progress-card"><div class="progress-label"><span id="label">准备中…</span><strong id="percent">0%</strong></div><div class="bar"><i id="bar"></i></div></section>
<div id="error" class="error"></div>
<section id="result" class="result"><img id="image" alt="生成结果"><a id="open" target="_blank" rel="noreferrer">打开原图</a></section>
<script>
const $=id=>document.getElementById(id);let timer;
function showProgress(p){const percent=Math.max(0,Math.min(100,Number(p?.percent)||0));$('progress').style.display='block';$('bar').style.width=percent+'%';$('percent').textContent=percent+'%';$('label').textContent=p?.label||'处理中…'}
async function poll(id){const s=await (await fetch('/api/jobs/'+id)).json();showProgress(s.progress);if(s.status==='succeeded'){clearInterval(timer);$('go').disabled=false;showProgress({percent:100,label:'完成'});if(s.imageUrl){$('image').src=s.imageUrl;$('open').href=s.imageUrl;$('result').style.display='block'}}else if(s.status==='failed'){clearInterval(timer);$('go').disabled=false;$('error').textContent=s.error||'生成失败';$('error').style.display='block'}return s}
$('go').onclick=async()=>{clearInterval(timer);$('go').disabled=true;$('error').style.display='none';$('result').style.display='none';showProgress({percent:0,label:'提交任务…'});const r=await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,aspectRatio:$('ratio').value,seed:Number($('seed').value),upscale:$('upscale').checked})});const j=await r.json();if(!r.ok){$('go').disabled=false;$('error').textContent=j.error||'提交失败';$('error').style.display='block';return}timer=setInterval(()=>poll(j.jobId),1000);poll(j.jobId)};
</script>
