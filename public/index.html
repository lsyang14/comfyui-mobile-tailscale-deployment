<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComfyUI Mobile</title>
<style>
:root{color-scheme:dark}body{font:16px system-ui;max-width:680px;margin:0 auto;padding:1.25rem;background:#101114;color:#f3f4f6}h1{font-size:2rem;margin:.5rem 0 1.5rem}.field{margin:1rem 0}.field label{display:block;font-weight:700;margin-bottom:.35rem}.hint{display:block;color:#9ca3af;font-size:.84rem;margin-top:.2rem}textarea,input,select,button{font:inherit;width:100%;box-sizing:border-box;margin:.35rem 0;padding:.75rem;border-radius:10px;border:1px solid #4b5563;background:#202226;color:#f3f4f6}textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.check{display:flex;align-items:center;gap:.5rem;margin:.7rem 0}.check input{width:auto;margin:0}button{background:#326bff;border:0;cursor:pointer;margin-top:1rem}button:disabled{opacity:.6;cursor:wait}.progress-card{display:none;margin-top:1rem;padding:1rem;border:1px solid #374151;border-radius:12px;background:#191b20}.progress-label{display:flex;justify-content:space-between;margin-bottom:.5rem}.bar{height:12px;background:#30343d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4f8cff;transition:width .25s}.result{display:none;margin-top:1.25rem}.result img{max-width:100%;display:block;border-radius:12px;box-shadow:0 8px 30px #0008}.result a{display:inline-block;margin-top:.75rem;color:#8ab4ff}.error{display:none;color:#ff9f9f;margin-top:1rem}
</style>
<h1>ComfyUI Mobile</h1>
<div class="field"><label for="prompt">提示词</label><textarea id="prompt" rows="6" placeholder="描述你想生成的图片"></textarea><span class="hint">建议具体描述主体、风格、构图和光线。</span></div>
<div class="row"><div class="field"><label for="ratio">画面比例</label><select id="ratio"><option>1:1 (Square)</option><option>2:3 (Portrait Photo)</option><option>3:2 (Photo)</option><option selected>3:4 (Portrait Standard)</option><option>4:3 (Standard)</option><option>9:16 (Portrait Widescreen)</option><option>16:9 (Widescreen)</option></select></div><div class="field"><label for="megapixels">图像像素量</label><select id="megapixels"><option value="1" selected>1 MP（较快）</option><option value="2">2 MP（更清晰）</option></select></div></div>
<div class="field"><label for="seed">随机种子</label><input id="seed" type="number" value="-1"><span class="hint">填 -1 表示每次自动随机；填正整数可复现相近结果。</span></div>
<label class="check"><input id="refine" type="checkbox"> <span>提示词润色</span></label><span class="hint">让工作流中的文本模型自动扩写和整理提示词。</span>
<label class="check"><input id="lora" type="checkbox"> <span>启用 LoRA 风格</span></label><span class="hint">启用工作流内置的 Krea2 Darkbrush LoRA。</span>
<label class="check"><input id="upscale" type="checkbox"> <span>高清修复</span></label><span class="hint">当前工作流为 Krea2 主流程，高清修复开关会保留用于后续增强节点。</span>
<button id="go">生成图片</button>
<section id="progress" class="progress-card"><div class="progress-label"><span id="label">准备中…</span><strong id="percent">0%</strong></div><div class="bar"><i id="bar"></i></div></section><div id="error" class="error"></div><section id="result" class="result"><img id="image" alt="生成结果"><a id="open" target="_blank" rel="noreferrer">打开原图</a></section>
<script>
const $=id=>document.getElementById(id);let timer;
function showProgress(p){const percent=Math.max(0,Math.min(100,Number(p?.percent)||0));$('progress').style.display='block';$('bar').style.width=percent+'%';$('percent').textContent=percent+'%';$('label').textContent=p?.label||'处理中…'}
async function poll(id){const s=await (await fetch('/api/jobs/'+id)).json();showProgress(s.progress);if(s.status==='succeeded'){clearInterval(timer);$('go').disabled=false;showProgress({percent:100,label:'完成'});if(s.imageUrl){$('image').src=s.imageUrl;$('open').href=s.imageUrl;$('result').style.display='block'}}else if(s.status==='failed'){clearInterval(timer);$('go').disabled=false;$('error').textContent=s.error||'生成失败';$('error').style.display='block'}return s}
$('go').onclick=async()=>{clearInterval(timer);$('go').disabled=true;$('error').style.display='none';$('result').style.display='none';showProgress({percent:0,label:'提交任务…'});const r=await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,aspectRatio:$('ratio').value,megapixels:Number($('megapixels').value),seed:Number($('seed').value),refinePrompt:$('refine').checked,enableLora:$('lora').checked,upscale:$('upscale').checked})});const j=await r.json();if(!r.ok){$('go').disabled=false;$('error').textContent=j.error||'提交失败';$('error').style.display='block';return}timer=setInterval(()=>poll(j.jobId),1000);poll(j.jobId)};
</script>
