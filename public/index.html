<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComfyUI Mobile</title><style>body{font:16px system-ui;max-width:680px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}textarea,input,button{font:inherit;width:100%;box-sizing:border-box;margin:.5rem 0;padding:.7rem;border-radius:8px;border:1px solid #555;background:#222;color:#eee}button{background:#326bff;border:0;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}img{max-width:100%;margin-top:1rem}</style><h1>ComfyUI Mobile</h1><textarea id="prompt" rows="6" placeholder="输入提示词"></textarea><div class="row"><input id="ratio" value="3:4 (Portrait Standard)"><input id="seed" type="number" value="-1"></div><label><input id="upscale" type="checkbox"> 高清修复</label><button id="go">生成</button><pre id="status"></pre><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{ $('status').textContent='提交中…'; const r=await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,aspectRatio:$('ratio').value,seed:Number($('seed').value),upscale:$('upscale').checked})}); const j=await r.json(); if(!r.ok){$('status').textContent=j.error;return} const timer=setInterval(async()=>{const s=await (await fetch('/api/jobs/'+j.jobId)).json();$('status').textContent=JSON.stringify(s,null,2);if(s.status==='succeeded'||s.status==='failed')clearInterval(timer)},1500)};</script></html>
