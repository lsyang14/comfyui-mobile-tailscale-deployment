<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComfyUI Mobile</title><style>:root{color-scheme:dark}body{font:16px system-ui;max-width:680px;margin:auto;padding:1.2rem;background:radial-gradient(circle at top,#1c3158,#101114 48%);color:#f3f4f6}header{display:flex;justify-content:space-between;align-items:center}h1{margin:.4rem 0 1.4rem}.online{font-size:.85rem}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777}.ok{background:#35d07f}.bad{background:#ff6464}.actions{display:flex;gap:.5rem;align-items:center}.glass,button,.icon{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none;color:#f7f9ff;background:#ffffff18;border:1px solid #ffffff38;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px #ffffff25,0 8px 24px #0003;border-radius:12px;transition:.2s}.glass:hover,button:hover,.icon:hover{background:#ffffff2d;transform:translateY(-1px)}.icon{font-size:1.25rem;padding:.5rem}.page-nav{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1rem 0}.page-nav .glass{min-height:48px;width:100%}.field{margin:1rem 0}.field label{display:block;font-weight:700;margin-bottom:.35rem}textarea,input,select{font:inherit;width:100%;box-sizing:border-box;margin:.35rem 0;padding:.75rem;border-radius:10px;border:1px solid #ffffff25;background:#ffffff0d;color:#f3f4f6;backdrop-filter:blur(10px)}button{font:inherit;width:100%;margin:.35rem 0;padding:.75rem;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.check{display:flex;align-items:center;gap:.5rem}.check input{width:auto}.error{color:#ff9f9f;margin-top:1rem}.progress{display:none;margin-top:1rem;padding:1rem;border:1px solid #ffffff25;border-radius:12px;background:#ffffff0c;backdrop-filter:blur(12px)}.bar{height:12px;background:#30343d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4f8cff}.result{display:none;margin-top:1rem}.result img{max-width:100%;border-radius:12px}</style><header><h1>ComfyUI Mobile</h1><div class="actions"><span class="online"><i id="dot" class="dot"></i> <span id="online">检测中…</span></span><a class="icon" href="/account" title="个人中心">👤</a></div></header><section id="login"><div class="field"><label>普通用户登录</label><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码"><button id="loginBtn">登录</button><div id="loginError" class="error"></div></div></section><main id="app" hidden><nav class="page-nav"><a class="glass" href="/gallery">我的图库</a><a class="glass" href="/account">个人中心</a></nav><div class="field"><label for="prompt">提示词</label><textarea id="prompt" rows="6" placeholder="描述你想生成的图片"></textarea></div><div class="row"><div class="field"><label for="ratio">画面比例</label><select id="ratio"><option>1:1 (Square)</option><option>2:3 (Portrait Photo)</option><option>3:2 (Photo)</option><option selected>3:4 (Portrait Standard)</option><option>4:3 (Standard)</option><option>9:16 (Portrait Widescreen)</option><option>16:9 (Widescreen)</option></select></div><div class="field"><label for="megapixels">图像像素量（MP）</label><input id="megapixels" type="number" min="1" max="16" step="0.1" value="1.0"></div></div><div class="field"><label for="seed">随机种子</label><input id="seed" type="number" value="-1"></div><label class="check"><input id="refine" type="checkbox">提示词润色</label><label class="check"><input id="lora" type="checkbox">启用 LoRA 风格</label><label class="check"><input id="upscale" type="checkbox">高清修复</label><button id="go">生成图片</button><section id="progress" class="progress"><div><span id="label">准备中…</span><strong style="float:right" id="percent">0%</strong></div><div class="bar"><i id="bar"></i></div></section><div id="error" class="error"></div><section id="result" class="result"><img id="image" alt="生成结果"><br><a id="open" class="glass" target="_blank">打开原图</a></section></main><script>const $=id=>document.getElementById(id);let timer;async function status(){try{const x=await(await fetch('/api/comfy/status')).json();$('dot').className='dot '+(x.online?'ok':'bad');$('online').textContent=x.online?'ComfyUI 在线':'ComfyUI 离线'}catch{$('dot').className='dot bad';$('online').textContent='检测失败'}}status();setInterval(status,5000);function show(p){const n=Math.max(0,Math.min(100,Number(p?.percent)||0));$('progress').style.display='block';$('bar').style.width=n+'%';$('percent').textContent=n+'%';$('label').textContent=p?.label||'处理中…'}async function poll(id){const s=await(await fetch('/api/jobs/'+id)).json();show(s.status==='queued'?{label:`排队中，前面还有 ${Math.max(0,(s.queuePosition||1)-1)} 个任务`,percent:0}:s.progress);if(s.status==='succeeded'){clearInterval(timer);$('go').disabled=false;show({label:'完成',percent:100});if(s.imageUrl){$('image').src=s.imageUrl;$('open').href=s.imageUrl;$('result').style.display='block'}}if(s.status==='failed'){clearInterval(timer);$('go').disabled=false;$('error').textContent=s.error||'生成失败'}}$('loginBtn').onclick=async()=>{const r=await fetch('/api/auth/user-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(!r.ok){$('loginError').textContent=(await r.json()).error||'登录失败';return}$('login').hidden=true;$('app').hidden=false};fetch('/api/auth/me').then(r=>{if(r.ok){$('login').hidden=true;$('app').hidden=false}});$('go').onclick=async()=>{clearInterval(timer);$('go').disabled=true;$('error').textContent='';$('result').style.display='none';show({label:'提交任务…',percent:0});const r=await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,aspectRatio:$('ratio').value,megapixels:Number($('megapixels').value),seed:Number($('seed').value),refinePrompt:$('refine').checked,enableLora:$('lora').checked,upscale:$('upscale').checked})});const j=await r.json();if(!r.ok){$('go').disabled=false;$('error').textContent=j.error||'提交失败';return}timer=setInterval(()=>poll(j.jobId),1000);poll(j.jobId)}</script></html>
