<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台</title><style>:root{color-scheme:dark}body{font:16px system-ui;max-width:680px;margin:auto;padding:1.2rem;background:#1b1d21;color:#f3f4f6}input{font:inherit;width:100%;box-sizing:border-box;padding:.75rem;margin:.35rem 0;border-radius:10px;border:1px solid #ffffff25;background:#ffffff0d;color:#fff;backdrop-filter:blur(10px)}.glass,button{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none;color:#f7f9ff;background:#ffffff18;border:1px solid #ffffff38;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px #ffffff25,0 8px 24px #0003;border-radius:12px;padding:.75rem;margin:.35rem 0;cursor:pointer}button{font:inherit;width:100%}.error{color:#ff9f9f}.user-row{padding:.7rem 0;border-bottom:1px solid #ffffff20;min-height:2rem}.delete{width:auto;float:right;padding:.35rem}</style><h1>管理后台</h1><section id="login"><p>管理员专用登录入口</p><input id="username" placeholder="管理员用户名"><input id="password" type="password" placeholder="管理员密码"><button id="loginBtn">登录</button><div id="error" class="error"></div></section><main id="app" hidden><p>用户管理</p><input id="newUsername" placeholder="新用户名"><input id="newPassword" type="password" placeholder="初始密码"><button id="create">创建用户</button><div id="users"></div><p><a class="glass" href="/">返回普通用户入口</a></p></main><script>const $=id=>document.getElementById(id);function renderUsers(items){const root=$('users');while(root.firstChild)root.removeChild(root.firstChild);for(const u of items){const row=document.createElement('div');row.className='user-row';row.append(document.createTextNode(`${u.username}（${u.role}）`));if(u.role==='user'){const button=document.createElement('button');button.className='delete';button.textContent='删除';button.addEventListener('click',()=>del(u.id));row.append(button)}root.append(row)}}async function load(){const r=await fetch('/api/admin/users');if(!r.ok){$('error').textContent='管理员权限验证失败';return}const x=await r.json();renderUsers(x.items)}async function del(id){await fetch('/api/admin/users/'+encodeURIComponent(id),{method:'DELETE'});load()}$('loginBtn').onclick=async()=>{const r=await fetch('/api/auth/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(!r.ok){$('error').textContent=(await r.json()).error||'登录失败';return}$('login').hidden=true;$('app').hidden=false;load()};$('create').onclick=async()=>{await fetch('/api/admin/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('newUsername').value,password:$('newPassword').value})});$('newUsername').value='';$('newPassword').value='';load()};fetch('/api/auth/me').then(async r=>{if(r.ok&&((await r.json()).role==='admin')){$('login').hidden=true;$('app').hidden=false;load()}})</script></html>
